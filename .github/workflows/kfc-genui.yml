name: KFC GenUI

on:
  workflow_dispatch:
    inputs:
      execution:
        description: Live execution scope
        required: true
        default: full-qualification
        type: choice
        options:
          - full-qualification
          - focused-runtime
  pull_request:
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"
      - "docs/superpowers/**"
      - "docs/wayfinder/**"
  push:
    branches: [main]
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"
      - "docs/superpowers/**"
      - "docs/wayfinder/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kfc-agent-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin fc5fcafbaf7e0f00afbdd668ab90f6be0439b947
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.14
      - run: python -m pip install --disable-pip-version-check -e services/kfc-recommendation-scorer
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run policies:check
      - run: npm run check
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kfc_live_monitor_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Customer chat unit and widget tests
        run: flutter test test/features/customer_chat

  mandatory-live-text-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.execution == 'full-qualification'
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: kfc-live-text-qualification-ci
      LANGSMITH_ENDPOINT: https://apac.api.smith.langchain.com
      LANGSMITH_TRACING: "true"
      KFC_LIVE_ADVISORY_CANARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - run: npm ci
        working-directory: services/kfc-agent-backend
      - name: Validate mandatory live text secrets
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required"; exit 1; }
          test -n "$GOOGLE_API_KEY" || { echo "GOOGLE_API_KEY is required"; exit 1; }
          test -n "$LANGSMITH_API_KEY" || { echo "LANGSMITH_API_KEY is required"; exit 1; }
      - name: Run mandatory OpenAI and Google text qualification (3 repetitions)
        working-directory: services/kfc-agent-backend
        env:
          KFC_LIVE_TEXT_QUALIFICATION_ARTIFACT: ${{ runner.temp }}/kfc-live-text-qualification/manifest.json
          KFC_LIVE_TEXT_QUALIFICATION_EXPECTED_SHA: ${{ github.sha }}
        run: npm run test:live:qualification:text
      - name: Upload mandatory text qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfc-live-text-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/kfc-live-text-qualification
          if-no-files-found: error
      - name: Run separate interruption boundary
        working-directory: services/kfc-agent-backend
        run: npm run test:live:interruption

  focused-runtime-canaries:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.execution == 'focused-runtime'
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            model: gpt-5-mini-2025-08-07
            report: openai-scenario-07.json
          - provider: google
            model: gemini-3.1-flash-lite
            report: google-scenario-07.json
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: kfc-ticket49-${{ github.sha }}
      LANGSMITH_ENDPOINT: https://apac.api.smith.langchain.com
      LANGSMITH_TRACING: "true"
      RUN_LIVE_AI_SCENARIOS: "1"
      KFC_AGENT_PROFILE_MODE: qualification
      KFC_LIVE_FORCE_FIRST_RETRY: "1"
      KFC_LIVE_HIGH_RISK_REPETITIONS: "1"
      KFC_LIVE_SCENARIO_MODE: text
      KFC_LIVE_FOCUSED_TURN_ID: 07-ca-nhan-hoa-va-loyalty.json#1
      KFC_AGENT_PROVIDER: ${{ matrix.provider }}
      KFC_AGENT_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - run: npm ci
        working-directory: services/kfc-agent-backend
      - name: Validate focused runtime secrets
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required"; exit 1; }
          test -n "$GOOGLE_API_KEY" || { echo "GOOGLE_API_KEY is required"; exit 1; }
          test -n "$LANGSMITH_API_KEY" || { echo "LANGSMITH_API_KEY is required"; exit 1; }
      - name: Run focused ${{ matrix.provider }} StateGraph canary
        working-directory: services/kfc-agent-backend
        run: |
          mkdir -p "${{ runner.temp }}/kfc-focused-runtime"
          npx --no-install vitest run test/scenarios/live-ai-scenario-replay.test.ts \
            --reporter=json \
            --outputFile="${{ runner.temp }}/kfc-focused-runtime/${{ matrix.report }}"
      - name: Upload focused runtime canary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfc-focused-runtime-${{ matrix.provider }}-${{ github.sha }}
          path: ${{ runner.temp }}/kfc-focused-runtime/${{ matrix.report }}
          if-no-files-found: error
