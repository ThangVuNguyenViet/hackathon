name: KFC GenUI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"
  push:
    branches: [main]
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kfc-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - run: npm ci
      - run: npm run policies:check
      - run: npm run check
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kfc_live_monitor_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Customer chat unit and widget tests
        run: flutter test test/features/customer_chat

  live-scenarios:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            model: gpt-4.1-mini
          - provider: google
            model: gemini-3.1-flash-lite
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      KFC_AGENT_PROVIDER: ${{ matrix.provider }}
      KFC_AGENT_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - run: npm ci
        working-directory: services/kfc-agent-backend
      - name: Run all ${{ matrix.provider }} live scenarios
        working-directory: services/kfc-agent-backend
        run: npm run live:scenario
