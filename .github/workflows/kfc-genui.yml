name: KFC GenUI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"
  push:
    branches: [main]
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kfc-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run policies:check
      - run: npm run build
      - name: GenUI proof and context regression tests
        run: >-
          npm test --
          test/evaluation/genui-proof-evaluator.test.ts
          test/scripts/run-live-genui-integration-proof.test.ts
          test/graph/planner-context-policy.test.ts
          test/scenarios/scenario-replay.test.ts
          test/worker/worker.test.ts

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kfc_live_monitor_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Customer chat unit and widget tests
        run: flutter test test/features/customer_chat

  live-proof:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TOOL_PLANNER_MODEL: gpt-4.1
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: kfc-genui-live-proof-ci
      LANGSMITH_ENDPOINT: https://apac.api.smith.langchain.com
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: npm ci
        working-directory: services/kfc-agent-backend
      - run: flutter pub get
        working-directory: apps/kfc_live_monitor_flutter
      - name: Validate live proof secrets
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required"; exit 1; }
          test -n "$LANGSMITH_API_KEY" || { echo "LANGSMITH_API_KEY is required"; exit 1; }
      - name: Run consolidated live scenarios and boundaries
        working-directory: services/kfc-agent-backend
        run: |
          npm run test:live:scenarios
          npm run test:live:small-talk-router
          npm run test:live:direct-catalog
          npm run test:live:interruption
