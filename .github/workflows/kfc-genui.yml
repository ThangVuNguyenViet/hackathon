name: KFC GenUI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "apps/pvcfc_chat_web/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"
      - "docs/recommendations/**"
      - "docs/superpowers/**"
      - "docs/wayfinder/**"
  push:
    branches: [main]
    paths:
      - "apps/kfc_live_monitor_flutter/**"
      - "apps/pvcfc_chat_web/**"
      - "services/kfc-agent-backend/**"
      - "ai-talent-tracks/fnb/conversations/**"
      - ".github/workflows/kfc-genui.yml"
      - "docs/recommendations/**"
      - "docs/superpowers/**"
      - "docs/wayfinder/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kfc-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            services/kfc-agent-backend/package-lock.json
            apps/pvcfc_chat_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.14
      - run: python -m pip install --disable-pip-version-check -e services/kfc-recommendation-scorer
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - name: Install PVCFC client dependencies
        working-directory: apps/pvcfc_chat_web
        run: npm ci
      - name: Test PVCFC client
        working-directory: apps/pvcfc_chat_web
        run: npm test -- --run
      - name: Build PVCFC client
        working-directory: apps/pvcfc_chat_web
        run: npm run build
      - run: npm run check:architecture
      - run: npm run policies:check
      - run: npm run check
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kfc_live_monitor_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Customer chat unit and widget tests
        run: flutter test test/features/customer_chat

  tinyfish-live-canary:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/kfc-agent-backend
    env:
      RUN_LIVE_TINYFISH: "1"
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: services/kfc-agent-backend/package-lock.json
      - run: npm ci
      - name: Require TinyFish qualification credential
        run: test -n "$TINYFISH_API_KEY" || { echo "TINYFISH_API_KEY is required"; exit 1; }
      - run: npm run test:live:tinyfish
