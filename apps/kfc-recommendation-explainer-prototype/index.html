<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Throwaway KFC automatic recommendation engine explainer prototype"
    />
    <title>KFC Recommendation Explainer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      THROWAWAY PROTOTYPE.
      Three independent recommendation explanation layouts, switchable with
      ?variant=A|B|C. This is not a kiosk journey and does not call a live model.
    -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">KFC</div>
        <div>
          <h1>Why did the engine recommend this?</h1>
          <p>One independent request · affecting inputs → recommendation</p>
        </div>
      </div>
      <div class="prototype-badge">PROTOTYPE · SYNTHETIC DATA</div>
    </header>

    <main>
      <section class="scenario-bar" aria-label="Recommendation type">
        <div>
          <span class="eyebrow">Choose one independent engine call</span>
          <p>No kiosk journey order is implied.</p>
        </div>
        <div class="scenario-tabs" id="scenario-tabs"></div>
      </section>

      <section id="prototype-root" aria-live="polite"></section>
    </main>

    <nav class="variant-switcher" aria-label="Prototype variants">
      <button type="button" id="previous-variant" aria-label="Previous variant">
        ←
      </button>
      <div id="variant-options"></div>
      <button type="button" id="next-variant" aria-label="Next variant">→</button>
    </nav>

    <script src="./prototype.js"></script>
  </body>
</html>
