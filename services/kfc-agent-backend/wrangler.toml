name = "kfc-agent-backend-demo"
main = "src/worker.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

[vars]
META_INBOX_URL_TEMPLATE = "https://business.facebook.com/latest/inbox/all?asset_id={pageId}&selected_item_id={externalUserId}"
KFC_AGENT_PROVIDER = "openai"
KFC_AGENT_RUNTIME = "openai-responses"
KFC_AGENT_MODEL = "gpt-4.1-mini"
KFC_AGENT_COMPACTION_ENABLED = "true"
KFC_AGENT_COMPACTION_THRESHOLD_BYTES = "98304"
PVCFC_ASTRAFLOW_BASE_URL = "https://api-sg.umodelverse.ai/v1"
PVCFC_ASTRAFLOW_MODEL = "gpt-5.6-luna"
KFC_COMMERCE_MODE = "fixture"
KFC_COMMERCE_ENVIRONMENT = "sandbox"
KFC_CONFIRMATION_SIGNING_KEY_ID = "primary"
LANGSMITH_PROJECT = "kfc-agent-backend-worker"
LANGSMITH_ENDPOINT = "https://api.smith.langchain.com"
LANGSMITH_TRACING_SAMPLING_RATE = "1"

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[placement]
region = "aws:ap-southeast-1"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
# Legacy resource name; this UUID is sandbox-only.
database_name = "kfc-agent-demo"
database_id = "fb36af59-58d0-42e1-932b-144dbd17e477"

[[durable_objects.bindings]]
name = "DASHBOARD_SOCKET"
class_name = "DashboardSocket"

[[migrations]]
tag = "v1-dashboard-socket"
new_sqlite_classes = ["DashboardSocket"]

[[queues.producers]]
binding = "MESSENGER_WEBHOOK_QUEUE"
queue = "kfc-messenger-webhook-jobs"

[[queues.consumers]]
queue = "kfc-messenger-webhook-jobs"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "kfc-messenger-webhook-dlq"
