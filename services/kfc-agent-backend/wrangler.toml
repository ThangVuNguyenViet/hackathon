name = "kfc-agent-backend-demo"
main = "src/worker.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

[vars]
META_INBOX_URL_TEMPLATE = "https://business.facebook.com/latest/inbox/all?asset_id={pageId}&selected_item_id={externalUserId}"
KFC_COMMERCE_ENVIRONMENT = "sandbox"

[observability]
enabled = true

[placement]
region = "aws:us-east-1"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
# Legacy resource name; this UUID is sandbox-only.
database_name = "kfc-agent-demo"
database_id = "fb36af59-58d0-42e1-932b-144dbd17e477"

[[durable_objects.bindings]]
name = "DASHBOARD_SOCKET"
class_name = "DashboardSocket"

[[migrations]]
tag = "v1-dashboard-socket"
new_sqlite_classes = ["DashboardSocket"]

[[queues.producers]]
binding = "MESSENGER_WEBHOOK_QUEUE"
queue = "kfc-messenger-webhook-jobs"

[[queues.consumers]]
queue = "kfc-messenger-webhook-jobs"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "kfc-messenger-webhook-dlq"
