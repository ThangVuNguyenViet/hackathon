[project]
name = "kfc-recommendation-simulator"
version = "0.0.1"
description = "Throwaway synthetic behavioral-world prototype for KFC recommendations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "huggingface-hub>=0.36,<1",
  "jsonschema>=4.23,<5",
  "lightgbm>=4.6,<5",
  "mlflow>=3.5,<4",
  "numpy>=1.26,<2",
  "onnxruntime>=1.23,<2",
  "optuna>=4.5,<5",
  "pandas>=2.3,<4",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.7,<2",
  "shap>=0.49,<1",
  "tensorflow==2.16.2",
  "tensorflow-recommenders==0.7.7",
  "transformers>=4.57,<5",
  "xgboost>=3.0,<4",
]

[project.scripts]
kfc-rec-sim = "kfc_recommendation_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kfc_recommendation_simulator"]
